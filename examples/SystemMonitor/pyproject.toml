[project]
name = "System Monitor"
version = "0.1.0"
description = "FastAPI-based system monitor"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datastar-py>=0.6.5",
    "fastapi>=0.119.0",
    "htpy>=25.10.0",
    "psutil>=7.1.0",
    "pywebview>=6.0",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
