[project]
name = "old-python-app"
version = "1.0.0"
description = "An app using old Python version"
dependencies = []

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pyretort]
project_source_subdir = "src/old_python_app"
main_file = "main.py"
install_as_package = true
python_version = "3.10.0"  # This is below the minimum required version of 3.11
python_architecture = "amd64"
show_console_window = false
create_dist_zip_file = true
