[project]
name = "valid-test-app"
version = "1.0.0"
description = "A valid test application"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.15.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pyretort]
# Path to the project source directory relative to the project root
project_source_subdir = "src/valid_test_app"

# Name of the main Python file to execute
main_file = "main.py"

# Whether to install the project as a Python package during build
install_as_package = true

# Python version to use for the bundled distribution
python_version = "3.13.0"

# Python architecture to use
python_architecture = "amd64"

# Whether to show the console window when running the application
show_console_window = false

# Whether to create a ZIP archive of the distribution
create_dist_zip_file = true
