[project]
name = "pyretort"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruslan Iskov", email = "ruslan.rv.ua+github@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    #TODO: remove unused
    "pywin32>=308",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "python-slugify>=8.0.4",
    # "dparse[conda]>=0.6.4",
    # "depscanner",
    "packaging>=21.0",
    "tomlkit>=0.13.3",
    "tomli>=2.0.0 ; python_full_version < '3.11'",
]

[project.scripts]
pyretort = "pyretort:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "types-pywin32>=308.0.0",
    "tomli-w>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["examples", "downloads", "build", ".venv", "htmlcov", "temp"]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: end-to-end tests (deselect with '-m \"not e2e\"')",
    "integration: integration tests with external systems",
    "windows: Windows-specific tests",
    "requires_network: tests that require internet connection",
]

[tool.uv.workspace]
members = []

[tool.uv.sources]
depscanner = { git = "https://github.com/ruslan-rv-ua/depscanner.git" }
