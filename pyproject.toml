[project]
name = "pyretort"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "Ruslan Iskov", email = "ruslan.rv.ua+github@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pywin32>=308",
    "pydantic>=2.10.0",
    "typer>=0.15.0",
    "httpx>=0.27.0",
    "python-slugify>=8.0.4",
    "packaging>=21.0",
    "tomlkit>=0.13.3",
]

[project.scripts]
pyretort = "pyretort:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7.1",
    "mypy>=2",
    "ruff>=0.16",
    "types-pywin32>=312",
    "tomli-w>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["examples", "downloads", "build", ".venv", "htmlcov", "temp"]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: end-to-end tests (deselect with '-m \"not e2e\"')",
    "integration: integration tests with external systems",
    "windows: Windows-specific tests",
    "requires_network: tests that require internet connection",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.uv.workspace]
members = []


